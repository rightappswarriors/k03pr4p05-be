services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kompra
      POSTGRES_PASSWORD: kompra_dev
      POSTGRES_DB: kompra_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata: